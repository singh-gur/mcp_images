services:
  ddg-search:
    image: regv2.gsingh.io/personal/ddgs-mcp:latest
    container_name: ${CONTAINER_NAME:-duckduckgo-mcp-server}
    pull_policy: missing
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8000}
      DDG_SAFE_SEARCH: ${DDG_SAFE_SEARCH:-MODERATE}
      DDG_REGION: ${DDG_REGION:-}
    ports:
      - "${HOST_PORT:-8000}:${MCP_PORT:-8000}"
    networks:
      - ddg_net

networks:
  ddg_net:
    driver: bridge
    enable_ipv6: false
